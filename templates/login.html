<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            overflow:hidden;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .hero{

            width:100vw;
            height:100vh;

            background-image:url("{{ url_for('static', filename='images/home_image.png') }}");

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        .overlay{

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.55);

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{

            width:420px;

            background:rgba(255,255,255,0.95);

            border-radius:16px;

            padding:40px;

            box-shadow:
            0 10px 30px rgba(0,0,0,0.25);

            text-align:center;
        }

        .logo{

            font-size:38px;

            margin-bottom:15px;
        }

        h1{

            color:#2E7D32;

            font-size:32px;

            margin-bottom:30px;

            font-weight:600;
        }

        input{

            width:100%;

            padding:14px;

            margin-bottom:18px;

            border:1px solid #dcdcdc;

            border-radius:8px;

            font-size:16px;

            outline:none;

            transition:0.3s;
        }

        input:focus{

            border-color:#2E7D32;

            box-shadow:
            0 0 8px rgba(46,125,50,0.2);
        }

        .login-btn{

            width:100%;

            padding:15px;

            border:none;

            border-radius:8px;

            background:#2E7D32;

            color:white;

            font-size:17px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{

            background:#1B5E20;

            transform:translateY(-2px);
        }

        .footer{

            margin-top:20px;

            font-size:14px;

            color:#666;
        }

        .footer a{

            color:#2E7D32;

            text-decoration:none;

            font-weight:600;
        }

        .footer a:hover{

            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="hero">

    <div class="overlay">

        <div class="login-card">

            <div class="logo">

                🌳

            </div>

            <h1>Login</h1>

            <form method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    class="login-btn">

                    Sign In

                </button>

            </form>

            <div class="footer">

                Don't have an account?
                <a href="/register">

                    Register

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
