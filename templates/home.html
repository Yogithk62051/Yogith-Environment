<!DOCTYPE html>
<html>

<head>

    <title>Yogith Bharadwaj EcoSphere</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            overflow:hidden;
        }

        .hero{

            width:100vw;
            height:100vh;

            background-image:url("{{ url_for('static', filename='images/home_image.png') }}");

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            display:flex;
            flex-direction:column;

            justify-content:center;
            align-items:center;
        }

        .overlay{

            background:rgba(0,0,0,0.4);

            width:100%;
            height:100%;

            display:flex;
            flex-direction:column;

            justify-content:center;
            align-items:center;
        }

        h1{

            color:white;

            font-size:70px;

            margin-bottom:30px;

            text-shadow:3px 3px 10px black;
        }

        .start-btn{

            padding:18px 40px;

            font-size:24px;

            border:none;

            border-radius:10px;

            cursor:pointer;

            background:#2E7D32;

            color:white;

            transition:0.3s;
        }

        .start-btn:hover{

            transform:scale(1.1);
        }

    </style>

</head>

<body>

<div class="hero">

    <div class="overlay">

        <h1>
            🌱 Yogith Bharadwaj EcoSphere
        </h1>

        <a href="/register">

            <button class="start-btn">

                Enter EcoSphere

            </button>

        </a>

    </div>

</div>

</body>

</html>
